services:
    postgres:
        image: postgres:16-alpine
        container_name: food-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER:-food_equeue}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-food_equeue}
            POSTGRES_DB: ${DB_NAME:-food_equeue}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-food_equeue} -d ${DB_NAME:-food_equeue}"]
            interval: 5s
            timeout: 5s
            retries: 5

    app:
        # image: ${IMAGE_NAME}:${VERSION}.${BUILD_NUMBER}
        image: food-equeue-api
        # container_name: ${DOCKER_NAME}
        container_name: food-equeue-api
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '${PORT}:3000'
            # - "5000:3000"
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PORT: ${PORT}
            IS_DEV: "true"
            IS_LOCAL_NETWORK_DEPLOY: "true"
            CLIENT_APP_URL: "http://localhost:3005"
            CLIENT_APP_LOCAL_NETWORK_URL: "http://192.168.100.11:3005"

            JWT_SECRET: ${JWT_SECRET:-secure_access_secret}
            JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600s}

            DB_HOST: postgres
            DB_PORT: 5432
            DB_USER: ${DB_USER:-food_equeue}
            DB_PASSWORD: ${DB_PASSWORD:-food_equeue}
            DB_NAME: ${DB_NAME:-food_equeue}
volumes:
    postgres_data:
