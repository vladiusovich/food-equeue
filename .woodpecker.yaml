steps:
  - name: build-api
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: food-equeue/api
      context: packages/api
      dockerfile: packages/api/Dockerfile
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:7}
      output: type=docker
    when:
      - event: push
        branch: master

  - name: build-web
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: food-equeue/web
      context: packages/web
      dockerfile: packages/web/Dockerfile
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:7}
      output: type=docker
    when:
      - event: push
        branch: master

  - name: deploy
    image: docker/compose:alpine-1.29.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker compose -f docker-compose.yml up -d --force-recreate
    when:
      - event: push
        branch: master
